services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: earningsiq
      POSTGRES_USER: earningsiq
      POSTGRES_PASSWORD: earningsiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
