[project]
name = "earningsagentiq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "edgartools>=5.25.1",
    "fastapi>=0.135.2",
    "langchain-text-splitters>=1.1.1",
    "langchain-voyageai>=0.4.0",
    "langsmith>=0.7.22",
    "openai>=2.53.0",
    "psycopg2-binary>=2.9.11",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "requests>=2.32.5",
    "rq>=2.7.0",
    "tavily-python>=0.7.23",
    "tiktoken>=0.12.0",
    "uvicorn>=0.42.0",
]

[tool.pytest.ini_options]
markers = [
    "capability: probes real OpenRouter endpoints (costs money); run explicitly with -m capability",
    "benchmark: runs the full agent pipeline + Tavily research + LLM judge (~$1); run explicitly with -m benchmark",
]
addopts = "-m 'not capability and not benchmark'"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]

[tool.ruff.lint]
# BLE001: broad excepts are deliberate at resilience boundaries (fail-open rate limiter, EDGAR
# freshness fallback, never-raise benchmark extractors). DTZ011: naive local dates are fine for
# filing-cadence math. SIM117: nested `with get_connection() / conn.cursor()` is house style.
ignore = ["BLE001", "DTZ011", "SIM117"]
