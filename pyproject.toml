[project]
name = "earningsagentiq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "edgartools>=5.25.1",
    "fastapi>=0.135.2",
    "langchain-text-splitters>=1.1.1",
    "langchain-voyageai>=0.4.0",
    "langsmith>=0.7.22",
    "openai>=2.53.0",
    "psycopg2-binary>=2.9.11",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "requests>=2.32.5",
    "rq>=2.7.0",
    "tavily-python>=0.7.23",
    "tiktoken>=0.12.0",
    "uvicorn>=0.42.0",
]

[tool.pytest.ini_options]
markers = ["capability: probes real OpenRouter endpoints (costs money); run explicitly with -m capability"]
addopts = "-m 'not capability'"
